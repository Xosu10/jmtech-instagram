name: Publicar la curiosidad de informatica

# VIDEO DE CURIOSIDADES: lunes, miercoles y viernes a las 17:00 (hora de Madrid).
# Los videos ya montados (voz, imagenes, subtitulos) y su calendario estan en el repositorio privado jmtech-musica,
# carpeta curiosidades/ (cola.json dice que video toca cada dia). Aqui solo se sube el que toca hoy.
# GitHub programa en UTC. Madrid = UTC+1 en invierno y UTC+2 en verano: DOS disparos (15:00 y 16:00 UTC) y el programa
# solo publica si en Madrid son las 17:00-18:30 (y nunca dos curiosidades el mismo dia).
# Para PAUSAR: en config/calendario.json pon "curiosidades": false (o "pausado": true para todo).
# A mano (Run workflow): prueba en seco por defecto; con "ignorar_hora" publica el video que toque hoy aunque no sea la hora.

on:
  schedule:
    - cron: "0 15 * * 1,3,5"
    - cron: "0 16 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba en seco (NO publica en Instagram)"
        type: boolean
        default: true
      ignorar_hora:
        description: "Publicar el video que toque hoy aunque no sea la hora (solo manual)"
        type: boolean
        default: false

concurrency:
  group: publicar-curiosidad
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONPATH: src
  TZ: Europe/Madrid

jobs:
  curiosidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Descargar los videos (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Xosu10/jmtech-musica
          ssh-key: ${{ secrets.MUSICA_DEPLOY_KEY }}
          path: musica
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar la curiosidad de hoy
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          IGNORAR_HORA: ${{ inputs.ignorar_hora }}
        run: |
          args=(hoy --carpeta musica/curiosidades)
          [ "$IGNORAR_HORA" = "true" ] && args+=(--ignorar-hora)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python -m jmtech.curiosidad "${args[@]}"

      - name: Guardar el estado
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "JM TECH bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado ESTADO.md
          git diff --cached --quiet || git commit -m "chore: estado de las publicaciones (curiosidad)"
          git pull --rebase origin main
          git push origin HEAD:main
