name: Verificar conexion con Facebook

# Se lanza a mano. Muestra a que paginas de Facebook llega el token y que permisos tiene (no publica nada
# y el token nunca se muestra). Sirve para preparar la publicacion automatica de reels en la pagina de JM TECH.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar paginas y permisos
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PYTHONPATH: src
        run: python -m jmtech.facebook verificar
