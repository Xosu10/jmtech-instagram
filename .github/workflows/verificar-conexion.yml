name: Verificar conexion con Instagram

# Se lanza a mano. Comprueba que el token guardado en GitHub Secrets funciona
# y escribe solo el usuario y el id de la cuenta (no son secretos). El token nunca se muestra.
# Prueba los dos tipos de token que Meta puede dar:
#   1) token de Instagram (host graph.instagram.com)
#   2) token de usuario del sistema (host graph.facebook.com)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Identificador publico de la cuenta @jmtechmurcia (no es un secreto).
  IG_USER_ID: "17841471351315429"

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "ERROR: no existe el secreto IG_ACCESS_TOKEN en GitHub."
            exit 1
          fi

          echo "Prueba 1: token de Instagram (graph.instagram.com)"
          r1=$(curl -sS -G "https://graph.instagram.com/me" \
            --data-urlencode "fields=user_id,username" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          if ! echo "$r1" | jq -e '.error' > /dev/null; then
            echo "CONEXION CORRECTA (token de Instagram)"
            echo "Usuario de Instagram: $(echo "$r1" | jq -r '.username')"
            echo "Id de la cuenta: $(echo "$r1" | jq -r '.user_id')"
            exit 0
          fi
          echo "No vale como token de Instagram: $(echo "$r1" | jq -r '.error.message')"

          echo "Prueba 2: token de usuario del sistema (graph.facebook.com)"
          r2=$(curl -sS -G "https://graph.facebook.com/$IG_USER_ID" \
            --data-urlencode "fields=id,username" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          if ! echo "$r2" | jq -e '.error' > /dev/null; then
            echo "CONEXION CORRECTA (token de usuario del sistema)"
            echo "Usuario de Instagram: $(echo "$r2" | jq -r '.username')"
            echo "Id de la cuenta: $(echo "$r2" | jq -r '.id')"
            echo "Comprobando permiso de publicar (sin publicar nada)..."
            r3=$(curl -sS -G "https://graph.facebook.com/$IG_USER_ID/content_publishing_limit" \
              --data-urlencode "fields=quota_usage,config" \
              --data-urlencode "access_token=$IG_ACCESS_TOKEN")
            if echo "$r3" | jq -e '.error' > /dev/null; then
              echo "AVISO: no se pudo consultar el limite de publicacion."
              echo "$r3" | jq '{codigo: .error.code, tipo: .error.type, subcodigo: .error.error_subcode, mensaje: .error.message}'
              exit 1
            fi
            echo "PERMISO DE PUBLICAR CORRECTO. Publicaciones usadas hoy: $(echo "$r3" | jq -r '.data[0].quota_usage // 0') de $(echo "$r3" | jq -r '.data[0].config.quota_total // "?"')"
            exit 0
          fi
          echo "ERROR: Instagram rechazo el token en las dos pruebas."
          echo "$r2" | jq '{codigo: .error.code, tipo: .error.type, subcodigo: .error.error_subcode, mensaje: .error.message}'
          exit 1
