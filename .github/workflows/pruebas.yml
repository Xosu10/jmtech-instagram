name: Pruebas automaticas

on:
  push:
    paths: ["src/**", "tests/**", "contenido/**", "config/**", "assets/**", "requirements.txt", ".github/workflows/**", "infra/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "from jmtech.reel import _ffmpeg; print('ffmpeg:', _ffmpeg())"
        env:
          PYTHONPATH: src
      - run: pytest -q

      - name: Probar disparador externo sin publicar
        run: node --test infra/scheduler/worker.test.mjs
