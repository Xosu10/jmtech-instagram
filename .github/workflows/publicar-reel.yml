name: Publicar el reel del dia

# REEL AUTOMATICO: lunes a viernes a las 15:00 (hora de Madrid), del mismo servicio que la publicacion de las 19:00.
# GitHub programa en UTC. Madrid = UTC+1 en invierno y UTC+2 en verano: DOS disparos (13:00 y 14:00 UTC) y el programa
# solo publica si en Madrid son las 15:00-16:30 (y nunca dos reels el mismo dia).
# Musica: repositorio privado jmtech-musica (clave de solo lectura en el secreto MUSICA_DEPLOY_KEY).
# Si falta la clave, usa musica propia generada por codigo.
# Para PAUSAR: en config/calendario.json pon "reels": false (o "pausado": true para todo).
# A mano (Run workflow): con "tema" crea un reel de prueba; sin "tema" ejecuta el reel del dia. Prueba en seco por defecto.

on:
  schedule:
    - cron: "0 13 * * 1-5"
    - cron: "17,43 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "17,43 14 * * 1-5"
    - cron: "17 15 * * 1-5"
  workflow_dispatch:
    inputs:
      fecha_objetivo:
        description: "Fecha Madrid AAAA-MM-DD del disparo externo; vacía para ejecución manual"
        type: string
        default: ""
      dry_run:
        description: "Prueba en seco (NO publica en Instagram)"
        type: boolean
        default: true
      ignorar_hora:
        description: "Publicar el reel del dia aunque no sea la hora (solo manual)"
        type: boolean
        default: false
      tema:
        description: "Opcional: tema (id) para un reel de prueba, por ejemplo: tarjeta_grafica"
        type: string
        default: ""
      asset:
        description: "Opcional: archivo del catalogo para el reel de prueba"
        type: string
        default: ""
      video:
        description: "Opcional: video ya subido al repositorio (ruta). Vacio = se genera"
        type: string
        default: ""
      musica_indice:
        description: "Opcional (reel de prueba): 0, 1, 2... para una cancion distinta en cada reel de un lote"
        type: string
        default: ""

concurrency:
  group: publicar-reel
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONPATH: src
  TZ: Europe/Madrid
  MUSICA_DIR: musica

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIENE_CLAVE: ${{ secrets.MUSICA_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rechazar disparos de otro día
        env:
          FECHA_OBJETIVO: ${{ inputs.fecha_objetivo }}
        run: python -m jmtech.control_horario fecha "$FECHA_OBJETIVO"

      - name: Configurar git (hace falta antes de publicar, por si hay que subir un video de respaldo)
        run: |
          git config user.name "JM TECH bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Descargar la musica (repositorio privado)
        if: env.TIENE_CLAVE == 'true'
        uses: actions/checkout@v4
        with:
          repository: Xosu10/jmtech-musica
          ssh-key: ${{ secrets.MUSICA_DEPLOY_KEY }}
          path: musica
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar ffmpeg y musica
        run: |
          python -c "from jmtech.reel import _ffmpeg; print('ffmpeg:', _ffmpeg())"
          echo "Canciones disponibles: $(ls musica/*.mp3 2>/dev/null | wc -l)"

      - name: Crear y publicar el reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          IGNORAR_HORA: ${{ inputs.ignorar_hora }}
          TEMA: ${{ inputs.tema }}
          ASSET: ${{ inputs.asset }}
          VIDEO: ${{ inputs.video }}
          MUSICA_INDICE: ${{ inputs.musica_indice }}
        run: |
          if [ -n "$TEMA" ]; then
            args=(reel --tema "$TEMA")
            [ -n "$ASSET" ] && args+=(--asset "$ASSET")
            [ -n "$VIDEO" ] && args+=(--video "$VIDEO")
            [ -n "$MUSICA_INDICE" ] && args+=(--musica-indice "$MUSICA_INDICE")
          else
            args=(reel-hoy)
            [ "$IGNORAR_HORA" = "true" ] && args+=(--ignorar-hora)
          fi
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python -m jmtech.publicador "${args[@]}"

      - name: Comprobar publicación real
        if: success() && inputs.dry_run != true
        run: python -m jmtech.control_horario resultado reel

      - name: Guardar el estado
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "JM TECH bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado ESTADO.md
          git diff --cached --quiet || git commit -m "chore: estado de las publicaciones (reel)"
          git pull --rebase origin main
          git push origin HEAD:main
